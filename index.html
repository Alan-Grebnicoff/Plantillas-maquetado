<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="arriba">
        <figure class="contenedorTitulos">
            <p class="titulo plano">Holaaaaa</p>

            <p class="titulo">Holaaaaa</p>
            <p class="titulo">Holaaaaa</p>
            <p class="titulo">Holaaaaa</p>
        </figure>
    </header>
    <main>
        <article class="zona centro">
            <aside class="izquierda">
                <figure class="foto"></figure>
                <p class="descripcion plano">Le tengo que preguntar a Ivo si pongo texto o lo dejo como un caja con un numero de ancho</p>
            </aside>
            <section class="derecha">
                <figure class="imagen"></figure>
                <section class="contenido">
                    <div class="textoImagen">Esto es una imagen</div>
                    <p class="texto plano">Aca estoy describiendo la imagen que esta a la izquierda, después hay que preguntarle a Ivo lo mismo que antes</p>
                </section>
            </section>
        </article>
        <article class="zona abajo">
            <section class="seccion contenedorVideo">
                <figure class="video">
                    <span class="play">▶️</span>
                </figure>
                <figure class="contenedorTituloVideo">
                    <p class="titulo">Esto es un video</p>
                </figure>
            </section>
            <section class="seccion lista"></section>
        </article>
    </main>
</body>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.arriba {
    background-color: white;
    width: 100vw;
    height: 20vh;
    display: flex;
    justify-content: center;
    align-items: center;
    }
main {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.centro {
    width: 100vw;
    height: 15rem;
    background-color: white;

    padding: 2rem;

    flex-wrap: nowrap
}

}
