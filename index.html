<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="arriba">
        <div class="titulos">
        </div>
    </header>
    <main>
        <article class="zona centro">
            <section class="izquierda"></section>
            <section class="derecha"></section>
        </article>
        <article class="zona abajo">
            <section class="seccion video"></section>
            <section class="seccion lista"></section>
        </article>
    </main>
</body>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.arriba {
    background-color: white;
    width: 100vw;
    height: 20vh;
    display: flex;
    justify-content: center;
    align-items: center;
    }
main {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.centro {
    width: 100vw;
    height: 15rem;
    background-color: white;
    display: flex;
    padding: 2rem;
    padding-top: 0rem;
    flex-direction: row;
    flex-wrap: wrap;
}
.abajo {
    width: 100vw;
    height: 16rem;
    margin-top: 1rem;
    background-color: rgb(75, 75, 75);
    display: flex;
    flex-wrap: nowrap;
}
.seccion {
    width: 50vw;
    height: 100%
}
.titulos {
    background-color: yellow;
    width: 70%;
    height: 40%;
    margin: 2rem;
}
.izquierda {
    background-color: rgb(241, 18, 18);
    margin: 1rem;
    width: 25%;
    height: 12rem
}
.derecha {
    background-color: rgb(75, 75, 75);
    margin: 1rem;

    height: 12rem;
}

    background-color: rgb(17, 17, 17)
